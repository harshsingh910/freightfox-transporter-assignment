spring:
  datasource:
    url: ${DATABASE_URL:${DATABASE_PUBLIC_URL:${SPRING_DATASOURCE_URL:${POSTGRES_URL:}}}}
    username: ${PGUSER:${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  cache:
    type: redis

app:
  rate-limit:
    fallback-to-in-memory: ${RATE_LIMIT_FALLBACK_IN_MEMORY:false}
